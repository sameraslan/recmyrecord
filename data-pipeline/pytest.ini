[pytest]
testpaths = tests
pythonpath = .
addopts = -q
# tests/test_validate.py copies frontcreck/public/data (33 MB since the 10k catalog) once per test: a passed
# test's folder is removed at once instead of being kept for three runs (about 1.4 GB a run otherwise).
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
