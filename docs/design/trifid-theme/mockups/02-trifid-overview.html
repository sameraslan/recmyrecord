<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>recmyrecord — round two concept</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Schibsted+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Caveat:wght@400;500;600&display=block">
<style>
:root{
  --bg:#0b0a09; --panel:#0e0d0c; --float:#121110; --text:#ece8df; --dust:#aaa59b; --ash:#918c83;
  --rule:rgba(236,232,223,.11); --rule2:rgba(236,232,223,.22); --lamp:#e8e2d4; --lamp-ink:#12100d; --acc:#d9a066;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,serif;
  --sans:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:2px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
ol,ul{list-style:none}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:var(--bg)}
canvas#c{position:absolute;left:0;top:0}
#ov{position:absolute;inset:0;pointer-events:none}
.hdr{position:absolute;left:0;right:0;top:0;height:64px;z-index:20;display:flex;align-items:center;padding:0 32px;border-bottom:1px solid var(--rule);background:var(--hdr-bg,var(--bg))}
.wm{font-family:var(--serif);font-style:italic;font-weight:500;font-size:27px;letter-spacing:.005em;color:var(--text)}
.search{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:490px;height:40px;border:1px solid var(--rule2);border-radius:var(--r);display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;color:var(--dust);font-size:15px;background:var(--search-bg,transparent)}
.search svg{width:16px;height:16px;flex:none}
.search span{flex:1}
.search kbd{font-family:var(--sans);font-size:12px;border:1px solid var(--rule2);border-radius:var(--r);width:22px;height:22px;display:grid;place-items:center;color:var(--ash)}
.nav{margin-left:auto;display:flex;gap:26px;font-size:15px;color:var(--dust)}
.nav a{padding:21px 2px;position:relative}
.nav a.on{color:var(--text)}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:1px;background:var(--nav-line,var(--lamp))}
.album{position:absolute;left:0;top:64px;bottom:0;width:660px;z-index:10;background:var(--panel);border-right:1px solid var(--rule);overflow:hidden}
.amb{position:absolute;left:0;right:0;top:0;height:440px;pointer-events:none}
.album-in{position:absolute;inset:0;padding:18px 32px 0}
.close{position:absolute;right:10px;top:8px;width:44px;height:44px;display:grid;place-items:center;color:var(--dust)}
.close svg{width:18px;height:18px}
.trail{display:flex;align-items:center;gap:10px;height:28px;margin:0 48px 10px 0;font-size:13.5px;color:var(--dust);white-space:nowrap;overflow:hidden}
.trail .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.trail ol{display:flex;align-items:center;min-width:0}
.trail li{display:flex;align-items:center}
.trail li+li::before{content:"";width:5px;height:5px;margin:0 9px;border-top:1px solid var(--ash);border-right:1px solid var(--ash);transform:rotate(45deg)}
.trail li:last-child{color:var(--text)}
.seed{position:relative;display:grid;grid-template-columns:116px minmax(0,1fr);column-gap:22px;align-items:end;grid-template-areas:"cover artist" "cover title" "cover actions" "tags tags";grid-template-rows:1fr auto auto auto}
.seed .cv{grid-area:cover;align-self:start;width:116px;height:116px;box-shadow:0 18px 40px -20px rgba(0,0,0,.85)}
.seed-artist{grid-area:artist;font-size:15px;color:var(--dust)}
.seed-title{grid-area:title;font-family:var(--serif);font-weight:500;line-height:.96;letter-spacing:-.015em;margin-top:2px;font-size:48px}
.seed-title.m{font-size:40px}.seed-title.lg{font-size:30px;line-height:1.04}
.seed-actions{grid-area:actions;display:flex;align-items:center;gap:6px;margin-top:12px}
.btn{height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;background:var(--lamp);color:var(--lamp-ink);font-weight:600;font-size:14px;border-radius:var(--r)}
.btn svg{width:14px;height:14px}
.iq{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--rule2);border-radius:var(--r);color:var(--dust)}
.iq svg{width:17px;height:17px}
.tags{grid-area:tags;display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tags li{font-size:12.5px;line-height:1;padding:6px 8px;border-radius:var(--r);color:var(--dust);border:1px solid var(--rule2)}
.tags li.lit{color:var(--text);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.recs{position:relative;margin-top:18px}
.recs-h{font-family:var(--serif);font-style:italic;font-weight:500;font-size:21px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.rec{position:relative;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:18px 60px minmax(0,1fr);gap:14px;align-items:center;padding:11px 56px 11px 6px}
.rec.hot{background:var(--hot,rgba(236,232,223,.045))}
.rec.hot::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:2px;background:var(--acc)}
.rec-n{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ash);text-align:right;line-height:1}
.rec .cv{width:60px;height:60px}
.rec-text{min-width:0;display:grid}
.rec-title{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.08;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-artist{font-size:14px;color:var(--dust);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-shared{font-size:13px;color:var(--ash);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-shared span{color:var(--dust)}
.rec-sp{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;display:grid;place-items:center;color:var(--ash)}
.rec-sp svg{width:16px;height:16px}
.sim{position:absolute;z-index:12;width:268px;padding:14px 18px 13px;border:1px solid var(--rule);background:var(--float);border-radius:var(--r)}
.sim-l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust)}
.sim-track{position:relative;height:28px;margin:4px 8px 0}
.sim-track::before{content:"";position:absolute;left:0;right:0;top:13px;height:1px;background:var(--rule2)}
.sim-track i{position:absolute;top:10px;width:7px;height:7px;border-radius:50%;border:1px solid var(--ash);background:var(--float);transform:translateX(-50%)}
.sim-track i.on{top:5px;width:17px;height:17px;border:1px solid var(--lamp);background:var(--float)}
.sim-track i.on::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--lamp)}
.sim-stops{display:flex;justify-content:space-between;font-size:14px;color:var(--dust);margin-top:2px}
.sim-stops b{font-weight:500;color:var(--text)}
.sim-d{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--dust)}
.zoom{position:absolute;right:22px;bottom:22px;z-index:12;display:grid;gap:6px}
.zoom b{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--rule);background:var(--float);color:var(--dust);border-radius:var(--r)}
.zoom svg{width:16px;height:16px}
.hint{position:absolute;left:22px;bottom:22px;z-index:12;font-size:14px;color:var(--dust)}
.cv{background-repeat:no-repeat;background-color:#222;flex:none}
.mc{position:absolute;transform:translate(-50%,-50%)}
.badge{position:absolute;left:-9px;top:-9px;min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;font-size:12px;font-weight:600;line-height:1;border-radius:10px;background:var(--badge-bg,var(--bg));color:var(--badge-ink,var(--text));border:1px solid var(--badge-rule,var(--rule2))}
.hov{position:absolute;z-index:14;display:flex;align-items:center;gap:10px;padding:7px 14px 7px 7px;background:var(--float);border:1px solid var(--rule2);border-radius:var(--r);white-space:nowrap}
.hov .cv{width:40px;height:40px}
.hov b{display:block;font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.1}
.hov span{font-size:13px;color:var(--dust)}
.hdr{background:var(--hdr-bg);border-bottom-color:var(--rule)}
.album{background:var(--panel)}
.more{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:14.5px;color:var(--dust);border-bottom:1px solid var(--rule2);padding-bottom:3px}
.more svg{width:11px;height:11px}
.rec{padding-top:10px;padding-bottom:10px}
.rl{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;z-index:3;
  text-shadow:0 0 2px rgba(3,4,8,.95),0 0 6px rgba(3,4,8,.9),0 0 14px rgba(3,4,8,.75),0 0 28px rgba(3,4,8,.5)}
.rl b{display:block;font-family:var(--serif);font-weight:600;letter-spacing:.17em;text-transform:uppercase;line-height:1.05;color:var(--lc);padding-left:.17em}
.rl span{display:block;margin-top:3px;font-size:12.5px;letter-spacing:.05em;color:rgba(236,232,223,.78)}
.rl.fair b{font-weight:500;font-style:italic;text-transform:none;letter-spacing:.06em;opacity:.74}
.rl.quiet{opacity:.62}
.rl.on b{color:#fff}
.rl.on b::after{content:"";display:block;height:1px;margin:4px auto 0;width:60%;background:var(--lc);opacity:.8}
.evid{position:absolute;z-index:14;transform:translateX(-50%);padding:9px 14px 10px;background:var(--float);border:1px solid var(--rule2);border-radius:var(--r);font-size:13.5px;color:var(--text);white-space:nowrap}
.evid i{font-style:normal;color:var(--dust)}
.evid::before{content:"";position:absolute;left:50%;top:-5px;width:8px;height:8px;background:var(--float);border-left:1px solid var(--rule2);border-top:1px solid var(--rule2);transform:translateX(-50%) rotate(45deg)}
.badge{left:-10px;top:-10px}
.hint{text-shadow:0 0 8px #000}

.rl span.ev{font-size:13.5px;letter-spacing:.01em;color:#f3efe8;margin-top:7px}
.rl span.ev i{font-style:normal;color:rgba(236,232,223,.72)}
.rl.fair b{opacity:.66}
.hint{font-size:13.5px;color:rgba(236,232,223,.74);text-shadow:0 0 2px #000,0 0 8px #000,0 0 16px rgba(0,0,0,.8)}
:root{--bg:#07060a;--panel:rgba(9,8,12,.95);--float:rgba(11,10,15,.95);--hdr-bg:linear-gradient(rgba(7,6,10,.95),rgba(7,6,10,.84));--text:#f1ece4;--dust:#bab4ac;--ash:#97918a;--lamp:#f1ece4;--lamp-ink:#121016;--rule:rgba(241,236,228,.11);--rule2:rgba(241,236,228,.24)}
.amb{background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--acc) 13%,transparent),transparent 62%)}
.mc .cv{box-shadow:0 0 0 1px rgba(255,255,255,.85),0 0 0 3px rgba(7,6,10,.75),0 8px 26px rgba(0,0,0,.8)}
.mc.sd .cv{box-shadow:0 0 0 2px #07060a,0 0 0 4px #befff0,0 0 34px 4px rgba(190,255,236,.28)}
.mc.hot .cv{box-shadow:0 0 0 2px #befff0,0 0 0 4px rgba(7,6,10,.75),0 8px 26px rgba(0,0,0,.8)}
.badge{--badge-bg:#befff0;--badge-ink:#07130f;--badge-rule:#07060a}
.rl.on b::after{background:#befff0}
.sim-track i.on{border-color:#befff0}.sim-track i.on::after{background:#befff0}
.nav a.on::after{background:#befff0}

</style></head>

  const list=REG.map((r,k)=>({r,k})).sort((a,b)=>((b.r.id==opts.on)-(a.r.id==opts.on))||(b.r.strong-a.r.strong)||(b.r.n-a.r.n));

    if(!r.strong&&opts.noFair)continue;

    const sub=r.strong&&!ALBUM;

    let ok=false,yy=y,xx=x;
    for(const [ddx,ddy] of [[0,0],[0,-22],[0,22],[-40,0],[40,0],[0,-46],[0,46],[0,-84],[0,84],[-90,0],[90,0],[-80,-60],[80,60],[80,-60],[-80,60],[0,120],[110,90],[160,40],[-110,90],[0,-120],[170,110]]){xx=x+ddx;yy=y+ddy;const rc=[xx-w,yy-hh,xx+w,yy+hh];
      if(rc[0]<PANEL+12||rc[2]>W-12||rc[1]<HDR+12||rc[3]>H-12)continue;
      if(!hit(rc)){ok=true;blocks.push(rc);break}}
    if(!ok)continue;
    const e=el('div','rl'+(r.strong?'':' fair')+(ALBUM?' quiet':'')+(opts.on==r.id?' on':''),`<b style="font-size:${fs.toFixed(1)}px">${r.name}</b>`+(opts.on==r.id?`<span class="ev">${r.ev.replace(/, against (.*)$/,'<i>, against $1</i>')}</span>`:sub?`<span>${r.plain}</span>`:''));
    e.style.left=Math.round(xx)+'px';e.style.top=Math.round(yy)+'px';e.style.setProperty('--lc',labelCol(r));ov.appendChild(e);

}
// 0..1: how much a pixel sits under a label (soft)
function labelShade(L,x,y){let m=0;for(const l of L){const dx=Math.max(0,Math.abs(x-l.x)-l.w*.75)/(l.w*.5+26),dy=Math.max(0,Math.abs(y-l.y)-l.h*.5)/(l.h*.5+22);const d=dx*dx+dy*dy;if(d<4){const v=Math.exp(-d*1.6);if(v>m)m=v}}return m}
function underLabel(L,x,y){for(const l of L)if(Math.abs(x-l.x)<l.w&&Math.abs(y-l.y)<l.h)return true;return false}
// coarse brightness classes from album order; the long tail is treated as median
function starClass(i){return i<40?0:i<400?1:i<1500?2:i<3800?3:2}
function spike(x,y,ang,L,a,lw,col){const dx=Math.cos(ang)*L,dy=Math.sin(ang)*L;const lg=ctx.createLinearGradient(x-dx,y-dy,x+dx,y+dy);lg.addColorStop(0,`rgba(${col},0)`);lg.addColorStop(.5,`rgba(${col},${a})`);lg.addColorStop(1,`rgba(${col},0)`);ctx.strokeStyle=lg;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x-dx,y-dy);ctx.lineTo(x+dx,y+dy);ctx.stroke()}
function halo(x,y,R,a,col){const gr=ctx.createRadialGradient(x,y,0,x,y,R);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(.3,`rgba(${col},${a*.3})`);gr.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill()}
function pickHov(B,L){const sx=B[0].x,sy=B[0].y;for(let i=0;i<400;i++){if(B.some(b=>b.i==i)||D.t[i][0].length>22)continue;const x=PX[i],y=PY[i];if(x<PANEL+70||x>W-300||y<HDR+210||y>H-80)continue;let ok=true;
  const rc=[x-14,y-40,x+250,y+26];
  for(const b of B)if(rc[0]<b.x+b.h+10&&rc[2]>b.x-b.h-10&&rc[1]<b.y+b.h+10&&rc[3]>b.y-b.h-10)ok=false;
  for(const l of L)if(rc[0]<l.x+l.w&&rc[2]>l.x-l.w&&rc[1]<l.y+l.h&&rc[3]>l.y-l.h)ok=false;
  for(const b of B.slice(1))for(let t=0;t<=1;t+=.04){const lx=sx+(b.tx-sx)*t,ly=sy+(b.ty-sy)*t;if(lx>rc[0]-6&&lx<rc[2]+6&&ly>rc[1]-6&&ly<rc[3]+6)ok=false}
  if(ok)return i}return -1}
function hovCard(i){const hv=el('div','hov');hv.appendChild(cover(i,40));hv.appendChild(el('div','',`<b>${D.t[i][0]}</b><span>${D.t[i][1]}</span>`));hv.style.left=(PX[i]+16)+'px';hv.style.top=(PY[i]-27)+'px';stage.appendChild(hv)}
function pct(G,q,filter){const v=[];for(let i=0;i<N;i+=2){if(filter&&!filter(i))continue;v.push(G.at(PX[i],PY[i]))}v.sort((a,b)=>a-b);return v[Math.floor(v.length*q)]||1e-6}
// TRIFID — one emission/reflection nebula coloured by the shared five-family rule (regions/colour.json):
// rose fierce, gold warm, teal quiet, blue dark, violet urban. Gas is lit wherever albums are; dust lanes are atmosphere only.
chrome();
const B=layoutCovers();
const FAMC=[[236,72,96],[246,172,60],[46,186,164],[60,116,244],[196,92,232]],NEU=[150,140,138];
const CW=D.cw;
function famCol(w,o){ // w: five weights + neutral share at offset o
  const P=2.3;let t=0,s=0,m=0,r=0,g=0,b=0;const q=[0,0,0,0,0];
  for(let j=0;j<5;j++){s+=w[o+j];q[j]=Math.pow(Math.max(0,w[o+j]),P);t+=q[j]}
  if(t<1e-9)return [NEU[0],NEU[1],NEU[2]];
  for(let j=0;j<5;j++){const f=q[j]/t;if(f>m)m=f;r+=FAMC[j][0]*f;g+=FAMC[j][1]*f;b+=FAMC[j][2]*f}
  const neu=w[o+5]/(s+w[o+5]+1e-9),sat=Math.min(1,(.25+1.05*m))*(1-.7*neu);   // weak fits and neutral share lose colour

const LAB=regionLabels(B,r=>{const c=famCol(r.fw,0).map(v=>Math.round(v+(255-v)*.7));return `rgb(${c})`},{on:ALBUM?null:'playful'});
if(!ALBUM)LAB.push({x:400,y:H-30,w:400,h:14,r:null});
const mk=()=>new Grid(4,220);
const g=mk(),G6=[mk(),mk(),mk(),mk(),mk(),mk()];
for(let i=0;i<N;i++){const x=PX[i],y=PY[i];g.splat(x,y,1);for(let j=0;j<6;j++)G6[j].splat(x,y,CW[6*i+j])}
const big=g.copy().blur(.05*S),huge=g.copy().blur(.14*S),far=g.copy().blur(.3*S),vfar=g.copy().blur(.62*S),fine=g.copy().blur(.016*S);
const H6=G6.map(q=>q.copy().blur(.13*S));G6.forEach(q=>q.blur(.034*S));
const nb=pct(big,.6),nh=pct(huge,.6),nf=pct(fine,.85),nfar=pct(far,.5),nvf=pct(vfar,.5);
let fx=0,fy=0;if(ALBUM){fx=B[0].x;fy=B[0].y;let cx=0,cy=0;for(const b of B){cx+=b.x;cy+=b.y}fx=(fx+cx/B.length)/2;fy=(fy+cy/B.length)/2}
function fbmG(x,y,o){let s=0,a=1,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f+i*17.3,y*f+i*9.1);n+=a;a*=.6;f*=2.07}return s/n}
const img=ctx.createImageData(W,H),px=img.data;
const F=1/.2,OC=S>1000?6:5,w1=[0,0,0,0,0,0],w2=[0,0,0,0,0,0];
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const mx=(x-CX)/S+D.view.x,my=-(y-CY)/S+D.view.y,u=mx*F+20,v=-my*F+20;
  const qx=fbm(u+1.7,v+9.2,4)-.47,qy=fbm(u+8.3,v+2.8,4)-.47;
  const b=fbmG(u*1.25+qx*2.8,v*1.25+qy*2.8,OC+1);
  const dB=big.at(x,y)/nb,dH=huge.at(x,y)/nh,dF=Math.min(2,fine.at(x,y)/nf),dFar=far.at(x,y)/nfar,dV=vfar.at(x,y)/nvf;
  // lit gas wherever albums are; a thin neutral far field carries to every edge so the cloud has no outline
  const near=sm(.02,1.6,dB*.7+dH*.55);
  let L=(near*.84+.2*sm(.05,1.3,dFar)+.085*sm(0,1.1,dV)+.03)*(.32+1.2*b*b*1.6);
  // colour from the family weights: local where albums are, wider average further out, neutral in the far field
  let s1=0,s2=0;for(let j=0;j<6;j++){w1[j]=G6[j].at(x,y);w2[j]=H6[j].at(x,y);s1+=w1[j];s2+=w2[j]}
  let c=NEU;if(s2>1e-7){c=famCol(w2,0);if(s1>1e-7){const c1=famCol(w1,0),tt=sm(0,nb*.1,s1);c=[c[0]+(c1[0]-c[0])*tt,c[1]+(c1[1]-c[1])*tt,c[2]+(c1[2]-c[2])*tt]}
    const t2=sm(.02,.45,dFar);c=[NEU[0]+(c[0]-NEU[0])*t2,NEU[1]+(c[1]-NEU[1])*t2,NEU[2]+(c[2]-NEU[2])*t2]}
  // dust: thin, sharp, dark lanes that only show against bright gas; pure atmosphere, not tied to where albums are
  const rd=1-Math.abs(2*fbmG(u*1.5+qy*2.8+40,v*1.5+qx*2.8+13,OC)-1);
  const rd2=1-Math.abs(2*fbmG(u*3.1+qx*2.2+71,v*3.1+qy*2.2+29,OC)-1);
  const gate=sm(.54,.7,fbmG(u*.8+90,v*.8+55,3));
  const lane=Math.min(1,(sm(.9,.96,rd)*gate+sm(.93,.975,rd2)*.5*gate))*sm(.3,.75,L);
  let k=1,des=0;
  if(ALBUM){const d=Math.hypot(x-fx,y-fy);const e=Math.exp(-d*d/(2*230*230));k=.74*(1-.8*e);des=.6*e}
  const ls=labelShade(LAB,x,y);k*=1-.6*ls;

  L*=k;

  let r=(c[0]/255*L*.95+core*k)*A,gg=(c[1]/255*L*.95+core*k*.94)*A,bb=(c[2]/255*L*.95+core*k*.86)*A;
  const hi=Math.pow(Math.max(0,L-.55),2)*.5*A;r+=hi;gg+=hi*.94;bb+=hi*.86;

  const p=(y*W+x)*4;px[p]=255*Math.min(1,Math.max(0,.024+r+n));px[p+1]=255*Math.min(1,Math.max(0,.022+gg+n));px[p+2]=255*Math.min(1,Math.max(0,.034+bb+n));px[p+3]=255;
}
ctx.putImageData(img,0,0);
{const t=document.createElement('canvas');t.width=W;t.height=H;t.getContext('2d').putImageData(img,0,0);ctx.save();ctx.globalCompositeOperation='lighter';ctx.filter='blur(18px)';ctx.globalAlpha=.18;ctx.drawImage(t,0,0);ctx.restore()}
ctx.globalCompositeOperation='lighter';
const zk=Math.max(1,Math.min(1.3,S/800));
const RAD=[2.5,1.7,1.15,.8],ALP=[1,.95,.85,.72];
for(let i=N-1;i>=0;i--){const x=PX[i],y=PY[i];if(x<-20||x>W+20||y<-20||y>H+20)continue;const c=ACC[i],cl=starClass(i);
  const col=[0,1,2].map(j=>Math.round(255*.72+c[j]*.28));

  ctx.fillStyle=`rgba(${col},${a})`;ctx.beginPath();ctx.arc(x,y,RAD[cl]*zk,0,7);ctx.fill()}

  drawLines(B,{line:'rgba(190,255,236,.98)',hot:'#ffffff',casing:'rgba(7,6,10,.85)',glow:'#befff0',w:1.4});
  placeCovers(B);
  const hv=pickHov(B,LAB);if(hv>=0){hovCard(hv);ctx.strokeStyle='rgba(7,6,10,.8)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(PX[hv],PY[hv],9,0,7);ctx.stroke();ctx.strokeStyle='#befff0';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(PX[hv],PY[hv],9,0,7);ctx.stroke()}
}
